<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Program</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="calculator">
        <div class="display">
            <h1 id="display">0</h1>
        </div>
        <div class="buttons">
            <button id="btn" class="clear">C</button>
            <button id="btn" class="operand del">Del</button>
            <button id="btn" class="operand">/</button>
            <button id="btn" class="operand">*</button>
            <button id="btn" class="num">7</button>
            <button id="btn"eight class="num">8</button>
            <button id="btn" class="num">9</button>
            <button id="btn" class="operand">-</button>
            <button id="btn" class="num">4</button>
            <button id="btn" class="num">5</button>
            <button id="btn" class="num">6</button>
            <button id="btn" class="operand">+</button>
            <button id="btn" class="num">1</button>
            <button id="btn" class="num">2</button>
            <button id="btn" class="num">3</button>
            <button id="btn" class="num zero">0</button>
            <button id="btn" class="num">.</button>
            <button id="btn" class="equal operand">=</button>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
